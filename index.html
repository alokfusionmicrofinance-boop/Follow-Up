<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Follow-up Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6b5c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef2f4;--sf:#fff;--tx:#14262b;--mt:#5b6e74;--ln:#d5dfe2;--ac:#0f6b5c;--acx:#fff;--wn:#b45309;--er:#c0302b;--ok:#1d7a3e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1e;--sf:#18292d;--tx:#e6f0f1;--mt:#93a8ad;--ln:#2b4046;--ac:#3fb7a3;--acx:#06201b;--wn:#f0a04b;--er:#ff7b73;--ok:#59c77f}}
:root[data-theme="dark"]{--bg:#0f1b1e;--sf:#18292d;--tx:#e6f0f1;--mt:#93a8ad;--ln:#2b4046;--ac:#3fb7a3;--acx:#06201b;--wn:#f0a04b;--er:#ff7b73;--ok:#59c77f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:150px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mt);font-size:14px;margin:0 0 14px}
.sum{display:flex;gap:8px;margin-bottom:14px}
.sum div{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.sum b{display:block;font-size:24px}
.sum span{font-size:13px;color:var(--mt)}
.sum .o b{color:var(--er)}.sum .t b{color:var(--wn)}.sum .d b{color:var(--ok)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:14px;color:var(--mt);margin:12px 0 4px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.card.late{border-left:5px solid var(--er)}.card.now{border-left:5px solid var(--wn)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.top b{font-size:17px}
.badge{font-size:13px;padding:2px 9px;border-radius:99px;border:1px solid var(--ln);white-space:nowrap}
.meta{color:var(--mt);font-size:14px;margin-top:2px}
.due{font-size:14px;margin-top:6px;font-weight:600}
.late .due{color:var(--er)}.now .due{color:var(--wn)}
.note{margin-top:6px;font-size:15px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts a,.acts button,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);text-decoration:none;color:var(--tx);cursor:pointer}
.acts .p,.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.btn.d{color:var(--er)}
.empty{text-align:center;color:var(--mt);padding:36px 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:52px;border:0;background:none;font-size:15px;color:var(--mt)}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom,0px));min-height:52px;padding:0 20px;border-radius:99px;border:0;background:var(--ac);color:var(--acx);font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
.sheet.open{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--sf);border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chips button{min-height:40px;padding:0 12px;border-radius:99px;border:1px solid var(--ln);background:var(--bg);cursor:pointer}
.hist{font-size:14px;color:var(--mt);margin-top:10px}
.hist div{padding:4px 0;border-top:1px solid var(--ln)}
.row{display:flex;gap:8px;margin-top:16px}
.row>*{flex:1}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}
.hint{font-size:14px;color:var(--mt)}.grp{font-weight:700;margin:16px 0 6px;color:var(--ac)}.ok{color:var(--ok);font-weight:600;margin:0 0 8px}.chips label{display:inline-flex;gap:6px;align-items:center;margin:0;color:var(--tx)}.chips .dk{width:auto}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<main>
<h1>Follow-up Tracker</h1>
<p class="sub" id="today"></p>
<div class="sum" id="sum"></div>
<input id="q" type="search" placeholder="Search name, village, phone" style="margin-bottom:12px" hidden>
<div id="view"></div>
</main>
<button class="fab" id="add">+ Add customer</button>
<style>nav button{font-size:14px;flex:1;min-height:56px}</style><nav>
<button data-t="today" class="on">Today</button>
<button data-t="hot">Hot</button>
<button data-t="all">Customers</button>
<button data-t="stats">Summary</button>
</nav>
<div class="sheet" id="sheet"><div class="in" id="form"></div></div>
<script>
var KEY="followups_v1",ST=["New","Interested","Docs pending","On hold","CGT done","Disbursed","Rejected"],CLOSED=["Disbursed","Rejected"];
var leads=[],tab="today",toast="";
try{leads=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){leads=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(leads))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function today(){return iso(new Date())}
function plus(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function diff(s){var a=new Date(s+"T00:00:00"),b=new Date(today()+"T00:00:00");return Math.round((a-b)/864e5)}
function fmt(s){if(!s)return"No date";var n=diff(s),d=new Date(s+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"});
if(n===0)return"Today ("+d+")";if(n===1)return"Tomorrow ("+d+")";if(n<0)return Math.abs(n)+" day"+(n<-1?"s":"")+" overdue ("+d+")";return d}
function open_(l){return CLOSED.indexOf(l.status)<0}
function due(l){return open_(l)&&l.next&&diff(l.next)<=0}
function wa(p){p=String(p||"").replace(/\D/g,"");if(p.length===10)p="91"+p;return"https://wa.me/"+p}
function cal(l){var s=(l.next||plus(1)).replace(/-/g,""),e=new Date(l.next+"T00:00:00");e.setDate(e.getDate()+1);
return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Call "+l.name+" ("+l.status+")")+"&dates="+s+"/"+iso(e).replace(/-/g,"")+"&details="+encodeURIComponent((l.village||"")+" "+(l.phone||"")+" "+((l.notes[l.notes.length-1]||{}).t||""))}
function card(l){var n=l.next&&open_(l)?diff(l.next):9,c=n<0?"late":n===0?"now":"",last=l.notes[l.notes.length-1];
return'<div class="card '+c+'"><div class="top"><b>'+esc(l.name)+'</b><span class="badge">'+esc(l.status)+'</span></div>'+
'<div class="meta">'+(l.centre?esc(l.centre)+" • ":"")+esc(l.village||"No village")+" • "+esc(l.phone||"No phone")+(l.amt?" • ₹"+esc(l.amt):"")+'</div>'+
(open_(l)?'<div class="due">'+fmt(l.next)+'</div>':"")+
(last?'<div class="note">'+esc(last.t)+'</div>':"")+
'<div class="acts">'+(l.phone?'<a class="p" href="tel:'+esc(l.phone)+'">Call</a><button data-m="'+l.id+'">Message</button>':"")+
'<button data-e="'+l.id+'">Update</button></div></div>'}
function render(){
document.getElementById("today").textContent=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
var o=0,t=0,m=0,mo=today().slice(0,7);
leads.forEach(function(l){if(due(l)){diff(l.next)<0?o++:t++}if(l.disbursedOn&&l.disbursedOn.slice(0,7)===mo)m++});
document.getElementById("sum").innerHTML='<div class="o"><b>'+o+'</b><span>Overdue</span></div><div class="t"><b>'+t+'</b><span>Due today</span></div><div class="d"><b>'+m+'</b><span>Loans this month</span></div>';
var q=document.getElementById("q"),v=document.getElementById("view"),h="";
q.hidden=tab!=="all";
document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===tab)});
document.getElementById("add").style.display=tab==="stats"?"none":"";
if(tab==="today"){var L=leads.filter(due).sort(function(a,b){return a.next<b.next?-1:1});
h=L.length?L.map(card).join(""):'<div class="empty">'+(leads.length?"No calls due. Nice work.":"No customers yet. Tap “Add customer” after your next call.")+'</div>'}
else if(tab==="all"){var s=q.value.toLowerCase(),L=leads.filter(function(l){return!s||(l.name+(l.village||"")+l.phone+l.status+(l.centre||"")).toLowerCase().indexOf(s)>=0}).sort(function(a,b){return(a.next||"9")<(b.next||"9")?-1:1});
h=L.length?L.map(card).join(""):'<div class="empty">No customers found.</div>'}
else{h='<div class="card">'+ST.map(function(s){return'<div class="stat"><span>'+s+'</span><b>'+leads.filter(function(l){return l.status===s}).length+'</b></div>'}).join("")+
'<div class="stat"><span>Total loans disbursed</span><b>'+leads.filter(function(l){return l.disbursedOn}).length+'</b></div></div>'+
'<div class="card"><b>Quick notes</b>'+qlist()+'</div>'+
'<div class="card"><b>Backup</b><p class="hint">Your data stays only in this phone’s browser. Copy a backup and send it to yourself on WhatsApp now and then.</p>'+
'<textarea id="bk" placeholder="Paste a backup here to restore"></textarea><div class="row"><button class="btn p" id="cp">Copy backup</button><button class="btn" id="rs">Restore</button></div><p class="hint" id="bm">'+esc(toast)+'</p></div>'}
v.innerHTML=h}
function sheet(id){var l=leads.filter(function(x){return x.id===id})[0]||{name:"",phone:"",village:cv(lc()),centre:lc(),amt:"",status:"New",next:plus(1),notes:[]};
document.getElementById("form").innerHTML='<b style="font-size:18px">'+(id?"Update customer":"Add customer")+'</b>'+
'<label>Name</label><input id="fn" value="'+esc(l.name)+'">'+
'<label>Phone</label><input id="fp" type="tel" inputmode="tel" value="'+esc(l.phone)+'">'+
'<label>Centre</label><input id="fc" list="cl" value="'+esc(l.centre)+'" placeholder="e.g. KEON-BANSPAL-05"><datalist id="cl">'+centres().map(function(c){return'<option value="'+esc(c)+'">'}).join("")+'</datalist>'+
'<label>Village</label><input id="fv" value="'+esc(l.village)+'">'+
'<label>Eligible loan (optional)</label><input id="fa" type="number" inputmode="numeric" value="'+esc(l.amt)+'">'+
'<label>Status</label><select id="fs">'+ST.map(function(s){return'<option'+(s===l.status?" selected":"")+'>'+s+'</option>'}).join("")+'</select>'+
'<label>Next follow-up date</label><input id="fd" type="date" value="'+esc(l.next)+'"><div class="chips"><button data-d="1">Tomorrow</button><button data-d="2">2 days</button><button data-d="7">1 week</button><button data-d="30">1 month</button></div>'+
'<label>Quick notes (tap to use)</label><div class="chips" id="qn">'+qchips()+'</div>'+
'<label>Note (saved with today’s date)</label><textarea id="fnote" placeholder="What did they say? What is pending?"></textarea><div class="chips"><button id="sq">Save this as a quick note</button></div>'+
(l.notes.length?'<div class="hist">'+l.notes.slice().reverse().map(function(n){return'<div>'+esc(n.d)+": "+esc(n.t)+'</div>'}).join("")+'</div>':"")+
'<div class="row"><button class="btn" id="cx">Cancel</button><button class="btn p" id="sv" data-id="'+(id||"")+'">Save</button></div>'+(id?"":'<div class="row"><button class="btn" id="sn">Save and add next</button></div>')+
(id?'<div class="row"><a class="btn" target="_blank" rel="noopener" href="'+cal(l)+'">Add phone reminder</a><button class="btn d" id="dl" data-id="'+id+'">Delete</button></div>':"");
document.getElementById("sheet").classList.add("open")}
function close_(){document.getElementById("sheet").classList.remove("open")}
document.addEventListener("click",function(e){var t=e.target;
if(t.dataset.t){tab=t.dataset.t;render()}
else if(t.id==="add")sheet("");
else if(t.dataset.e)sheet(t.dataset.e);
else if(t.id==="cx"||t.id==="sheet")close_();
else if(t.dataset.d){document.getElementById("fd").value=plus(+t.dataset.d)}
else if(t.id==="sv"){var n=document.getElementById("fn").value.trim();if(!n){document.getElementById("fn").focus();return}
var id=t.dataset.id,l=leads.filter(function(x){return x.id===id})[0];
if(!l){l={id:String(Date.now()),notes:[]};leads.push(l)}
l.name=n;l.phone=document.getElementById("fp").value.trim();l.village=document.getElementById("fv").value.trim();l.centre=document.getElementById("fc").value.trim().toUpperCase();l.amt=document.getElementById("fa").value;
var ns=document.getElementById("fs").value;l.status=ns;l.next=document.getElementById("fd").value;
if(ns==="Disbursed"&&!l.disbursedOn)l.disbursedOn=today();
var nt=document.getElementById("fnote").value.trim();if(nt)l.notes.push({d:today(),t:nt});
save();render();try{localStorage.setItem("fu_lastc",l.centre||"")}catch(x){}
if(window._nx){window._nx=false;sheet("")}else if(open_(l)&&l.next)remind(l);else close_()}
else if(t.id==="dl"){if(confirm("Delete this customer?")){leads=leads.filter(function(x){return x.id!==t.dataset.id});save();close_();render()}}
else if(t.id==="cp"){var s=JSON.stringify({leads:leads,qn:QN}),b=document.getElementById("bk");b.value=s;b.select();
try{navigator.clipboard.writeText(s).then(function(){toast="Copied. Paste it in WhatsApp or Notes.";render()},function(){toast="Select the text above and copy it.";render()})}catch(x){toast="Select the text above and copy it.";render()}}
else if(t.id==="rs"){try{var d=JSON.parse(document.getElementById("bk").value),qd=null;if(!Array.isArray(d)){qd=d.qn;d=d.leads}if(!Array.isArray(d))throw 0;
if(confirm("Replace current data with "+d.length+" customers?")){leads=d;if(Array.isArray(qd)){QN=qd;saveQ()}save();toast="Restored "+d.length+" customers.";render()}}catch(x){toast="That backup text is not valid.";render()}}
});
function remind(l){document.getElementById("form").innerHTML='<b style="font-size:18px">Saved</b><p class="hint">Set a phone reminder so your phone alarms you: '+esc(fmt(l.next))+'.</p><div class="row"><button class="btn" id="cx">Skip</button><a class="btn p" target="_blank" rel="noopener" href="'+cal(l)+'">Add phone reminder</a></div>'}
var TPL=[
{n:"Introduce loan",od:"ନମସ୍କାର {name}, ମୁଁ ଆଲୋକ, Fusion Finance (Naranpur ଶାଖା) ରୁ। ଆମେ ମହିଳାମାନଙ୍କୁ ବ୍ୟବସାୟ ଓ ବ୍ୟକ୍ତିଗତ ଋଣ ଦେଉଛୁ। ମାସିକ କିସ୍ତି, ସହଜ ପ୍ରକ୍ରିୟା। ଅଧିକ ଜାଣିବାକୁ ମୋତେ ଫୋନ୍ କରନ୍ତୁ: 7681857192",en:"Hello {name}, I am Alok from Fusion Finance (Naranpur branch). We give business and personal loans to women, with monthly repayment and a simple process. Call or WhatsApp me for details: 7681857192"},
{n:"Missed call, call me back",od:"ନମସ୍କାର {name}, ମୁଁ ଆଲୋକ, Fusion Finance ରୁ। ମୁଁ ଆପଣଙ୍କୁ ଫୋନ୍ କରିଥିଲି। ଫୁରସତ୍ ହେଲେ ଦୟାକରି ମୋତେ ଫେରି ଫୋନ୍ କରନ୍ତୁ।",en:"Hello {name}, this is Alok from Fusion Finance. I tried calling you. Please call me back when you are free."},
{n:"Documents needed",od:"ନମସ୍କାର {name}, ଆପଣଙ୍କ ଋଣ ପାଇଁ ଆଧାର କାର୍ଡ ଓ ଭୋଟର କାର୍ଡ ଦରକାର। ଦୟାକରି ପ୍ରସ୍ତୁତ ରଖନ୍ତୁ। - ଆଲୋକ, Fusion Finance",en:"Hello {name}, for your loan we need your Aadhaar card and Voter ID. Please keep them ready. - Alok, Fusion Finance"},
{n:"Loan possible on a date",od:"ନମସ୍କାର {name}, ଆପଣଙ୍କ ଋଣ {date} ରେ ପ୍ରକ୍ରିୟା ହୋଇପାରିବ। ମୁଁ ସେଦିନ ଆପଣଙ୍କୁ ଫୋନ୍ କରିବି। - ଆଲୋକ, Fusion Finance",en:"Hello {name}, your loan can be processed on {date}. I will call you that day. - Alok, Fusion Finance"},
{n:"Installment reminder",od:"ନମସ୍କାର {name}, ଆପଣଙ୍କ କିସ୍ତି {date} ରେ ଦେୟ। ଦୟାକରି ଟଙ୍କା ପ୍ରସ୍ତୁତ ରଖନ୍ତୁ। ଧନ୍ୟବାଦ। - ଆଲୋକ, Fusion Finance",en:"Hello {name}, your installment is due on {date}. Please keep the amount ready. Thank you. - Alok, Fusion Finance"},
{n:"Thank you",od:"ନମସ୍କାର {name}, Fusion Finance ସହ ଯୁକ୍ତ ହେଲାପାଇଁ ଧନ୍ୟବାଦ। ଯେକୌଣସି ସାହାଯ୍ୟ ପାଇଁ ମୋତେ ଫୋନ୍ କରନ୍ତୁ। - ଆଲୋକ",en:"Hello {name}, thank you for joining Fusion Finance. Call me any time you need help. - Alok"}];
var mid="",mtpl=0,mlang="od";
function mlead(){return leads.filter(function(x){return x.id===mid})[0]}
function mfill(l,s){var d=l.next?new Date(l.next+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}):"";return s.replace(/\{name\}/g,l.name).replace(/\{date\}/g,d)}
function mlink(){var l=mlead();document.getElementById("ms").href=wa(l.phone)+"?text="+encodeURIComponent(document.getElementById("mx").value)}
function mset(){var l=mlead();document.getElementById("mx").value=mfill(l,TPL[mtpl][mlang]);document.querySelectorAll("[data-l]").forEach(function(b){var on=b.dataset.l===mlang;b.style.background=on?"var(--ac)":"";b.style.color=on?"var(--acx)":""});mlink()}
function msheet(id){mid=id;var l=mlead();
document.getElementById("form").innerHTML='<b style="font-size:18px">Message '+esc(l.name)+'</b><label>Message type</label><select id="mt">'+TPL.map(function(t,i){return'<option value="'+i+'"'+(i===mtpl?" selected":"")+'>'+t.n+'</option>'}).join("")+'</select><div class="chips"><button data-l="od">Odia</button><button data-l="en">English</button></div><label>Edit before sending</label><textarea id="mx" style="min-height:150px"></textarea><div class="row"><button class="btn" id="cx">Close</button><button class="btn" id="mc">Copy</button></div>'+(GQ.length>1?'<div class="row"><button class="btn" id="gnx">Next member ('+(GQ.length-1)+' left)</button></div>':"")+'<div class="row"><a class="btn p" id="ms" target="_blank" rel="noopener">Send on WhatsApp</a></div>';
mset();document.getElementById("sheet").classList.add("open")}
document.addEventListener("click",function(e){var t=e.target;
if(t.dataset.m)msheet(t.dataset.m);
else if(t.dataset.l){mlang=t.dataset.l;mset()}
else if(t.id==="mc"){var x=document.getElementById("mx");x.select();try{navigator.clipboard.writeText(x.value);t.textContent="Copied"}catch(z){}}});
document.addEventListener("change",function(e){if(e.target.id==="mt"){mtpl=+e.target.value;mset()}});
document.addEventListener("input",function(e){if(e.target.id==="mx")mlink()});

function score(l){var s=(+l.loan||0)/1000;if(l.status==="CGT planned"&&l.cgt&&diff(l.cgt)<=0)s+=100;if(l.ct)s+=80;if(["Agreed","CGT done"].indexOf(l.status)>=0)s+=60;if(["Deciding","Interested","Docs pending"].indexOf(l.status)>=0)s+=40;if(l.next)s+=Math.min(20,-diff(l.next)*2);return s-(l.att||0)*5}
function prio(){return dueNow().sort(function(a,b){return score(b)-score(a)})}
function qgs(l,at){function b(t,lb){var i=ri(t);return i<0?"":'<button '+at+'="'+i+'" data-id="'+l.id+'">'+(lb||t)+'</button>'}
return'<label>Didn’t pick</label><div class="qg">'+b("NR")+b("Busy")+b("Switch off")+b("Network issue")+'</div><label>Talked</label><div class="qg">'+b("Interested")+b("Will decide, call back","Will decide")+b("Husband will decide","Husband decides")+b("Not interested")+'</div><label>Next step</label><div class="qg">'+b("Agreed for loan","Agreed")+b("CGT planned")+b("Docs not ready")+b("Disbursement","Loan given")+'</div>'}
function hl(){if(!LD)return;var N=["NR","Busy","Switch off","Network issue"],T=["Interested","Will decide","Husband decides","Agreed","CGT planned"];document.querySelectorAll("#form .qg button").forEach(function(b){var t=b.textContent.trim();b.classList.toggle("hl",(LD<15&&N.indexOf(t)>=0)||(LD>=45&&T.indexOf(t)>=0))})}
var _qs=qshow;qshow=function(){LD=0;PID="";_qs();if(document.querySelector("#form .qg"))document.getElementById("form").insertAdjacentHTML("beforeend",'<button class="btn" id="vr" style="width:100%;margin-top:8px">🎤 Say result</button>')};
function back(){if(!LC||Date.now()-LC.t<4000)return;LD=Math.round((Date.now()-LC.t)/1000);var c=LC;LC=null;if(c.q&&Q.length&&document.getElementById("sheet").classList.contains("open")){hl();return}
var l=lget(c.id);if(!l)return;PID=c.id;op('<b style="font-size:18px">How did the call go?</b><div class="meta">'+esc(l.name)+' • away about '+LD+' seconds</div>'+qgs(l,"data-pr")+'<div class="row"><button class="btn" id="cx">Later</button><button class="btn" id="vr">🎤 Say result</button></div>');hl()}
function vres(id,s){var K=[["not interested","Not interested"],["husband|family","Husband will decide"],["decide|think","Will decide, call back"],["busy","Busy"],["switch","Switch off"],["network","Network issue"],["no answer|not pick|nr","NR"],["interested","Interested"],["agree","Agreed for loan"],["cgt","CGT planned"],["document|docs","Docs not ready"],["call back|callback|call later","Call back"]],t=null;
for(var k=0;k<K.length&&!t;k++)if(new RegExp(K[k][0]).test(s))t=K[k][1];if(!t)return;var i=ri(t),r=allR()[i],dd=/tomorrow/.test(s)?1:/today/.test(s)?0:null,tm=/evening/.test(s)?"17:00":/morning/.test(s)?"10:00":/afternoon/.test(s)?"14:00":"";
CF=PID?"c":"q";var ok=(r.ask&&(dd!=null||tm))?apply(id,i,dd==null?1:dd,tm):apply(id,i);if(ok){if(PID){close_();render()}else{qi++;qshow()}}}
function weekly(){var f=plus(-6),c=0,r=0,ln=0,C={};leads.forEach(function(l){if(l.disbursedOn&&l.disbursedOn>=f)ln++;l.notes.forEach(function(x){if(x.d>=f){c++;var k=l.centre||"No centre";C[k]=C[k]||[0,0];C[k][0]++;if(NRS.indexOf(x.t)<0){r++;C[k][1]++}}})});
var A=Object.keys(C).filter(function(k){return C[k][0]>=3}).sort(function(a,b){return C[b][1]/C[b][0]-C[a][1]/C[a][0]});
op('<b style="font-size:18px">Weekly review</b><div class="stat"><span>Calls logged (7 days)</span><b>'+c+'</b></div><div class="stat"><span>Someone answered</span><b>'+r+(c?" ("+Math.round(r*100/c)+"%)":"")+'</b></div><div class="stat"><span>Loans given</span><b>'+ln+'</b></div>'+(A.length?'<div class="stat"><span>Best centre</span><b>'+esc(A[0])+'</b></div><div class="stat"><span>Hardest centre</span><b>'+esc(A[A.length-1])+'</b></div>':'<p class="hint">Not enough calls per centre yet.</p>')+'<div class="row"><button class="btn" id="cx">Close</button></div>')}
var _ut=utoast;utoast=function(m){_ut(m);var rt=m.split(": ").slice(1).join(": "),M={"Docs not ready":"Documents needed","Docs pending":"Documents needed","NR":"Missed call","Switch off":"Missed call","Busy":"Missed call","Disbursement":"Thank you","Agreed for loan":"CGT","CGT planned":"CGT"},k=M[rt];if(!k||!UNDO)return;var ix=TPL.findIndex(function(t){return t.n.indexOf(k)>=0});if(ix<0)return;var b=document.getElementById("ut");if(b)b.insertAdjacentHTML("beforeend",'<button data-um="'+ix+'" style="min-height:40px;padding:0 12px;border:0;border-radius:8px;background:var(--bg);color:var(--tx);font-weight:700">Message</button>')};
var _lk=lock;lock=function(){if(document.getElementById("lkx"))return;_lk();var d=document.body.lastChild;if(d&&d.style)d.id="lkx"};
function idle(){clearTimeout(IT);if(S.pin)IT=setTimeout(lock,180000)}
var _r4=render;render=function(){_r4();var q=document.getElementById("q"),v=document.getElementById("view");if(q.value.trim())return;
if(tab==="today"){var P=prio().slice(0,5),h=P.length?'<div class="grp">Next best calls</div>'+P.map(card).join(""):"",b=v.querySelector("#qs");if(b)b.insertAdjacentHTML("afterend",h);else v.insertAdjacentHTML("afterbegin",h);
if(new Date().getDay()===0)v.insertAdjacentHTML("afterbegin",'<button class="btn" id="wk" style="width:100%;margin-bottom:8px">Sunday: open your weekly review</button>')}
if(tab==="stats")v.innerHTML+='<div class="card"><button class="btn" id="wk" style="width:100%">Weekly review</button><label>Call order for Start calling</label><div class="row" style="margin-top:0"><button class="btn'+(S.ord==="p"?" p":"")+'" id="ordp">Priority</button><button class="btn'+(S.ord==="c"?" p":"")+'" id="ordc">By centre</button></div><label>Display</label><div class="row" style="margin-top:0"><button class="btn'+(S.big?" p":"")+'" id="big">Large text</button><button class="btn'+(S.one?" p":"")+'" id="one">One-hand mode</button></div></div>'};
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest('a[href^="tel:"]');if(!a)return;var n=dg(a.getAttribute("href").slice(4)),l=leads.filter(function(x){return dg(x.phone)===n||dg(x.ph2)===n})[0];if(l)LC={id:l.id,t:Date.now(),q:document.getElementById("sheet").classList.contains("open")}},true);
document.addEventListener("click",function(e){if(e.target.id!=="qs")return;e.stopPropagation();Q=(S.ord==="p"?prio():dueNow().sort(function(a,b){return(a.centre||"~").localeCompare(b.centre||"~")||(+b.loan||0)-(+a.loan||0)})).map(function(l){return l.id});qi=0;qshow()},true);
document.addEventListener("visibilitychange",function(){if(!document.hidden){setTimeout(back,300);if(S.pin&&HID&&Date.now()-HID>180000)lock()}else HID=Date.now()});
document.addEventListener("touchstart",idle);
document.addEventListener("click",function(e){var t=e.target,d=t.dataset;idle();
if(d.pr!=null){CF="c";if(apply(d.id,+d.pr)){close_();render()}}
else if(d.um!=null&&UNDO){mtpl=+d.um;msheet(UNDO.id)}
else if(t.id==="wk")weekly();
else if(t.id==="ordp"||t.id==="ordc"){S.ord=t.id==="ordp"?"p":"c";sset();render()}
else if(t.id==="big"||t.id==="one"){S[t.id]=!S[t.id];sset();appl();render()}
else if(t.id==="vr"){var SR=window.SpeechRecognition||window.webkitSpeechRecognition,id=PID||Q[qi];if(!SR){t.textContent="Not supported on this phone";return}if(!id)return;var r=new SR();r.lang="en-IN";r.onresult=function(ev){vres(id,ev.results[0][0].transcript.toLowerCase())};r.onerror=function(){t.textContent="Mic blocked"};t.textContent="Listening…";try{r.start()}catch(x){}}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
if(S.pin)lock();
render();appl();idle();
var go=(location.search.match(/go=(\w+)/)||[])[1];if(go==="call"){Q=prio().map(function(l){return l.id});qi=0;qshow()}else if(go==="add")sheet("");else if(go==="today"){tab="today";render()}
</script>
